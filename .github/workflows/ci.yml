name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每天 03:17 UTC 跑一次真实安装。错开整点：整点是 GitHub Actions 的高峰，
    # 排队时间明显更长。
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    name: Skill contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate skill metadata, layout and execution contracts
        run: python scripts/validate_skills.py
      - name: Check documented commands against real argparse schemas
        run: python scripts/validate_skill_commands.py
      - name: Validate documentation and Agent prompt paths
        run: python scripts/validate_document_paths.py
      # 本仓库是分叉：哪些地方和上游不一样，必须是可枚举的。
      # 新增/调整分叉标记后忘了跑 --write，这一步会红。
      - name: Local patch ledger
        run: python scripts/local_patches.py --check

  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Easel and test dependencies
        timeout-minutes: 15
        run: python -m pip install --prefer-binary -e . pytest
      # 不要改回 `pytest tests/`：技能自带的用例在 skills/**/tests/ 下，限定目录就把它们
      # （目前 38 个，skill-wechat-publisher 那批）整批排除在 CI 之外 —— 本地 `pytest` 全绿、
      # CI 也全绿，但那部分从来没在 CI 上跑过。从根目录跑一次，两边都覆盖。
      - name: Run unit tests
        timeout-minutes: 10
        # output_paths._discover_root() needs an outputs/ dir or EASEL_ROOT;
        # a fresh checkout has neither, so collection fails without this.
        env:
          EASEL_ROOT: ${{ github.workspace }}
        run: python -m pytest -v -o faulthandler_timeout=90

  harness-portability:
    name: Agent settings (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install settings test dependencies
        run: python -m pip install pytest fastapi httpx uvicorn sse-starlette python-multipart requests websocket-client cryptography
      - name: Verify user installations and settings
        run: python -m pytest -q tests/test_runtime_env.py tests/test_openclaw_cmd_resolution.py tests/test_openclaw_cmd_shim.py tests/test_agent_harnesses.py tests/test_pr1.py tests/test_installation.py tests/test_setup_optional_harness.py

  # 两个安装脚本此前在 CI 里零覆盖 —— setup.ps1 把 setup.sh 的版本假设 bug 原样复刻了一
  # 遍却没人发现，根因就在这里。这个 job 全程在 ubuntu 上跑（shellcheck 与 PSScriptAnalyzer
  # 都是跨平台的），~90s，不下载任何东西，适合挂在每个 PR 上。
  lint-installers:
    name: Installer lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax
        run: |
          for f in setup.sh scripts/gateway.sh agents/sync.sh; do
            echo "== bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        # 原先用 ludeeus/action-shellcheck@master —— 它随 master 漂移：同一份代码，
        # 2026-11-08 那次定时跑里它直接以 exit 2 退出（shellcheck 的 2 = 有文件读不了/
        # 参数不对），11 秒就把整个 job 干掉，而本地 shellcheck 对 7 个脚本零告警。
        # 改成显式调用系统 shellcheck：文件集自己算、版本可打印、失败点可读。
        run: |
          set -uo pipefail
          command -v shellcheck >/dev/null 2>&1 || sudo apt-get install -y shellcheck
          files=()
          while IFS= read -r f; do
            case "$f" in
              skills/builtin/video-production/vendor/*) continue ;;
              *.sh|*.bash|*.bats|*.dash|*.ksh) files+=("$f"); continue ;;
            esac
            if head -c 64 "$f" 2>/dev/null | head -1 | grep -qE '^#!.*(sh|bash)'; then
              files+=("$f")
            fi
          done < <(git ls-files)
          printf '待检文件 %d 个：\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck --version | head -2
          shellcheck -x -S warning -f gcc "${files[@]}"

      # PowerShell 侧：解析 + 静态分析。作者的开发机是 Linux，改 setup.ps1 没法本地验证，
      # 这里是唯一的把关点，所以 Error 级别直接判失败。
      # 只检查我们自己维护的 .ps1：vendor/video-pipeline-sdk 下那几个不在本仓库范围内，
      # 扫进来只会把真问题埋在噪音里（shellcheck 那边也同样排除了该目录）。
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $files = git ls-files '*.ps1' | Where-Object { $_ -notmatch 'vendor/' }
          if (-not $files) { throw '没找到要检查的 .ps1' }
          $bad = $false
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { Write-Host "== $f"; $errors | Format-List; $bad = $true }
          }
          if ($bad) { throw 'PowerShell 解析失败（注意 setup.ps1 必须保持 UTF-8 with BOM）' }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # PSGallery 偶发拉不下来。上一版 job 耗时 5 分半、几乎全花在 Install-Module 上然后
          # 直接 exit 1，日志里分不清是「模块装不上」还是「扫出 Error」。装不上属于环境问题，
          # 打 warning 跳过；装上了就照常扫，Error 级别一律判失败。
          try {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          } catch {
            Write-Host "::warning::PSScriptAnalyzer 安装失败，跳过 PowerShell 静态分析：$($_.Exception.Message)"
            exit 0
          }
          $files = git ls-files '*.ps1' | Where-Object { $_ -notmatch 'vendor/' }
          if (-not $files) { throw '没找到要检查的 .ps1' }
          # -Path 只收单个字符串，传数组会抛错却仍让这一步「0 findings」通过 —— 必须逐个扫。
          $r = @($files | ForEach-Object {
                  Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 })
          Write-Host "扫描 $($files.Count) 个文件，findings: $($r.Count)"
          if ($r) { $r | Format-Table -AutoSize RuleName,Severity,ScriptName,Line,Message }
          if ($r | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer 报告了 Error' }

  # setup.ps1 的容忍层必须在**真实的 Windows PowerShell 5.1** 上验证一次。
  # 作者的开发机是 Linux，pwsh 7 虽然能装但复现不了 5.1 的关键行为：Stop 模式下
  # 原生命令的 stderr 会被包成 ErrorRecord 抛 NativeCommandError。实测把修复
  # （ErrorActionPreference=Continue）去掉，pwsh 7 上测试照样通过 —— 所以这个
  # job 是该缺陷类唯一真正的把关点。5.1 是 Windows 自带版本，必须先跑它。
  powershell-tolerance:
    name: PowerShell tolerance (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]   # powershell = Windows PowerShell 5.1
    steps:
      - uses: actions/checkout@v7
      - name: Run tolerance probe (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/ps_tolerance_probe.ps1
      - name: Run tolerance probe (PowerShell Core)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/ps_tolerance_probe.ps1

  # 现有 test job 从不构建前端，而 doctor.py 把 web/frontend/dist/index.html 当作安装成功的
  # 判据之一 —— TypeScript 一旦编译不过，CI 全绿而用户装完打开是空白页。
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Frontend regression tests
        run: node --test ../../tests/frontend/*.test.mjs
      - run: npm run build

  # 真·跑一遍安装。只在 nightly / 手动触发 / 打了 ci:full-install 标签的 PR 上跑：
  # 一次完整安装要下 ~1GB（pip 的 opencv/faster-whisper/rembg + npm + Chromium），
  # windows-latest 上 I/O 更慢且按 2 倍计费，挂在每个 PR 上并不现实。
  # 日常 PR 由 lint-installers 与 pytest 里的 check-mode 回归把关。
  install-real:
    name: Real install (${{ matrix.os }})
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'push'
      || contains(github.event.pull_request.labels.*.name, 'ci:full-install')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          # openclaw@2026.10.8 requires Node >=24.22.1 <25 || >=26.12.1;
          # setup-node '24' resolved to 24.21.0 and the install failed.
          node-version: '24.22.1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # CI 里没有真 key。doctor 的认证检查是静态的（只判「非空且非占位符」），
      # 给一个语法合法的假值即可走通整条配置链路。
      - name: Seed .env
        shell: bash
        run: |
          cp .env.example .env
          printf '\nEASEL_LLM_API_KEY=sk-ci-not-a-real-key-0123456789\n' >> .env
          printf 'EASEL_LLM_BASE_URL=https://example.invalid/v1\n' >> .env
          printf 'CLAUDE_MODEL=anthropic/claude-sonnet-4-6\n' >> .env

      # setup.sh 只在有 TTY 时建 .venv；CI 没有 TTY，它会退化成「装进系统 Python」，
      # 于是后面 doctor 步找 .venv/bin/easel 必然落空（2026-11-06 那次就是 exit 127）。
      # 这里显式建一次，让 CI 走真实用户路径（虚拟环境），两边行为才一致。
      - name: Create venv
        shell: bash
        run: python -m venv .venv

      - name: Install (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash setup.sh --openclaw

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell       # 5.1：Windows 自带版本，必须按它验证
        # 30 分钟不够：一次完整安装要下 ~1GB（pip 的重包在 Windows 上尤其慢），
        # 2026-11 两次分别卡在 60 分钟和 30 分钟上限。这里放到 45 分钟并配合
        # setup.ps1 里的 [HH:mm:ss] 时间戳 —— 真挂住能看见挂在哪一步，真只是慢则能跑完。
        timeout-minutes: 45
        run: ./setup.ps1 -OpenClaw -NonInteractive

      # 这一条是重点：setup 必须可重入。2026.9.x 拒绝「会删掉已存在子键的整块写入」，
      # 于是首次安装能过、第二次重跑必失败 —— 两边都真实发生过，只有跑第二遍才看得见。
      - name: Install again (idempotency)
        if: runner.os != 'Windows'
        run: bash setup.sh --openclaw

      - name: Install again (idempotency, Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./setup.ps1 -OpenClaw -NonInteractive

      - name: doctor
        shell: bash
        run: |
          # 三级兜底：venv 里有就用 venv 的；没有就退到 PATH（setup.sh 在无 TTY 下把
          # console script 装进系统 Python）；最后才是 Windows 的 Scripts 路径。
          # 老写法只有「.venv/bin/easel 存在」和「.venv/Scripts/easel.exe」两条路，
          # 第一条不成立时在 ubuntu 上会去执行一个 Windows 路径 → exit 127。
          if [ -x .venv/bin/easel ]; then .venv/bin/easel doctor
          elif command -v easel >/dev/null 2>&1; then easel doctor
          else .venv/Scripts/easel.exe doctor; fi

      - name: Upload install report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-report-${{ matrix.os }}
          path: |
            outputs/_install/last-install.json
          if-no-files-found: warn

      # setup.ps1 在每一步把 [HH:mm:ss] 写进这个文件；安装被超时杀掉时，控制台日志要
      # 登录才能看，但这里的输出会变成运行页可见的 annotation（匿名也能读），
      # 所以「卡在第几步」永远不会再变成黑盒。
      - name: Report install progress
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          f="${RUNNER_TEMP}/easel-setup-progress.txt"
          if [ ! -f "$f" ]; then
            echo "::warning title=install progress::没有进度文件，安装可能没跑到第一个步骤"
            exit 0
          fi
          {
            echo "### 安装进度（最后到达的步骤）"
            echo '```'
            tail -n 25 "$f"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 8 "$f" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice title=install progress::$line"
          done
